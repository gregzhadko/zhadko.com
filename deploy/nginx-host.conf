# Snippet for the HOST nginx (the one that already serves zhadko.com and
# /starcraft/). Add the `location /` block inside the existing
# `server { server_name zhadko.com ...; listen 443 ssl; ... }` block.
# Keep the existing /starcraft/ and other locations: nginx picks the longest
# matching prefix, so they keep working.

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

