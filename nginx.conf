# nginx config INSIDE the site container. The host nginx on the server
# terminates TLS and proxies zhadko.com/ to this container (see DEPLOY.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative so they work behind the host proxy.
    absolute_redirect off;

    # TLS and access logs are handled by the host nginx.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # English lives at the root.
    location = /en  { return 301 /; }
    location ^~ /en/ { return 301 /; }

    location ~* \.(css|js|svg|jpg|jpeg|png|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
